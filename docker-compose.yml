services:
  agentsdx:
    image: ghcr.io/duck-labs/agentsdx-server:latest
    volumes:
      - ./data:/data
      - ./vm:/app/vm:ro
    environment:
      AGENTSDX_VAULT_SECRET: "${AGENTSDX_VAULT_SECRET}"
      AGENTSDX_SERVER_URL: "${AGENTSDX_SERVER_URL}"
      AGENTSDX_VM_DIR: "/app/vm"
    ports:
      - "8080:8080"
